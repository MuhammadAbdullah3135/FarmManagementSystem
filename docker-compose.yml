version: '3.8'

# Secrets are sourced from a local .env file (gitignored — see .env.example).
#   cp .env.example .env   then fill in real values before `docker compose up`.
#
# Fail fast: the api service aborts at startup if DB_PASSWORD or JWT_SIGNING_KEY
# is empty, instead of booting with an effectively broken configuration. The db
# container additionally refuses to start with an empty SA_PASSWORD (SQL Server
# exits with "must be set" if the password is missing or under 8 characters).
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Raw secrets passed through so the entrypoint guard can verify them.
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
      - ConnectionStrings__DefaultConnection=Server=db;Database=FMS;User=sa;Password=${DB_PASSWORD};TrustServerCertificate=true
      - Jwt__SecretKey=${JWT_SIGNING_KEY}
      - Jwt__Issuer=FMS
      - Jwt__Audience=FMS
      - Cors__AllowedOrigins__0=http://localhost:3000
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$DB_PASSWORD" ]; then
          echo "ERROR: DB_PASSWORD is not set. Copy .env.example to .env and fill in real values." >&2
          exit 1
        fi
        if [ -z "$$JWT_SIGNING_KEY" ]; then
          echo "ERROR: JWT_SIGNING_KEY is not set. Copy .env.example to .env and fill in real values." >&2
          exit 1
        fi
        exec dotnet FMS.API.dll
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqldata:
