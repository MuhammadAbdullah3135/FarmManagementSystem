# Local development stack: API + PostgreSQL.
#
# Secrets are sourced from a local .env file (gitignored — see .env.example).
#   cp .env.example .env   then fill in real values before `docker compose up`.
#
# Fail fast: the api service aborts at startup if DB_PASSWORD or JWT_SIGNING_KEY
# is empty, instead of booting with an effectively broken configuration, and the
# API's own JwtSigningKeyGuard refuses to start on a placeholder key (this stack
# runs ASPNETCORE_ENVIRONMENT=Production, so that guard is active here).
#
# PostgreSQL, not SQL Server: the API is Npgsql (see Program.cs's UseNpgsql and
# the InitialPostgres migrations). An earlier revision of this file still ran
# SQL Server and passed a SQL Server connection string, which Npgsql cannot even
# parse (`User=` is not an Npgsql keyword) — TrackedConfigDriftTests now asserts
# the two cannot drift apart again.
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Raw secrets passed through so the entrypoint guard can verify them.
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=FMS;Username=postgres;Password=${DB_PASSWORD}
      - Jwt__SecretKey=${JWT_SIGNING_KEY}
      - Jwt__Issuer=FarmManagementSystem
      - Jwt__Audience=FarmManagementSystem
      - Cors__AllowedOrigins__0=http://localhost:3000
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$DB_PASSWORD" ]; then
          echo "ERROR: DB_PASSWORD is not set. Copy .env.example to .env and fill in real values." >&2
          exit 1
        fi
        if [ -z "$$JWT_SIGNING_KEY" ]; then
          echo "ERROR: JWT_SIGNING_KEY is not set. Copy .env.example to .env and fill in real values." >&2
          exit 1
        fi
        exec dotnet FMS.API.dll
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=FMS
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Without a passing healthcheck the api never starts, because it waits on
    # `condition: service_healthy`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FMS"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
