<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Management System</title>
    <script>
      /*
       * Polyfills for older Android WebViews (Chrome < 84/98 era).
       * Runs before the app bundle so charts (ResizeObserver) and deep-clone
       * helpers (structuredClone) never crash the app into a blank page.
       */
      (function () {
        // ---- Object.hasOwn (Chrome >= 93) ----
        if (!Object.hasOwn) {
          Object.hasOwn = function (obj, prop) {
            return Object.prototype.hasOwnProperty.call(obj, prop);
          };
        }

        // ---- structuredClone (Chrome >= 98) ----
        // Type-aware deep clone. NOT JSON-based: Date/RegExp/Map/Set/Error/
        // ArrayBuffer/typed arrays/File/Blob are reconstructed properly;
        // unknown exotics are returned as-is instead of silently corrupted.
        if (typeof window.structuredClone !== 'function') {
          var structuredCloneImpl = function (value) {
            if (
              value === null ||
              typeof value !== 'object' ||
              typeof value === 'function'
            ) {
              return value;
            }
            if (value instanceof Date) return new Date(value.getTime());
            if (value instanceof RegExp) {
              var re = new RegExp(value.source, value.flags);
              re.lastIndex = value.lastIndex;
              return re;
            }
            if (value instanceof Array) {
              var arr = new Array(value.length);
              for (var i = 0; i < value.length; i++) arr[i] = structuredCloneImpl(value[i]);
              return arr;
            }
            if (value instanceof Map) {
              var map = new Map();
              value.forEach(function (v, k) {
                map.set(structuredCloneImpl(k), structuredCloneImpl(v));
              });
              return map;
            }
            if (value instanceof Set) {
              var set = new Set();
              value.forEach(function (v) {
                set.add(structuredCloneImpl(v));
              });
              return set;
            }
            if (value instanceof Error) {
              var err = new value.constructor(value.message);
              err.name = value.name;
              err.stack = value.stack;
              return err;
            }
            if (typeof ArrayBuffer !== 'undefined' && value instanceof ArrayBuffer) {
              return value.slice(0);
            }
            if (typeof File !== 'undefined' && value instanceof File) {
              return new File([value], value.name, { type: value.type, lastModified: value.lastModified });
            }
            if (typeof Blob !== 'undefined' && value instanceof Blob) {
              return value.slice(0, value.size, value.type);
            }
            // Plain object (or exotic): clone own enumerable props; exotics
            // without own props are returned as-is.
            var out = {};
            var hasKeys = false;
            for (var key in value) {
              if (Object.prototype.hasOwnProperty.call(value, key)) {
                out[key] = structuredCloneImpl(value[key]);
                hasKeys = true;
              }
            }
            return hasKeys ? out : value;
          };
          window.structuredClone = function (value) {
            return structuredCloneImpl(value);
          };
        }

        // ---- ResizeObserver (Chrome >= 84) ----
        // Minimal functional fallback: reports the initial size once so
        // ResponsiveContainer-based charts render at their first measured
        // size. Re-measure on resize is not supported (cosmetic on legacy
        // WebViews) — but nothing throws.
        if (typeof window.ResizeObserver !== 'function') {
          window.ResizeObserver = function (callback) {
            this._callback = callback;
            this._observed = [];
          };
          window.ResizeObserver.prototype.observe = function (target) {
            if (!target || this._observed.indexOf(target) !== -1) return;
            var self = this;
            this._observed.push(target);
            window.requestAnimationFrame(function () {
              var rect = target.getBoundingClientRect();
              if (typeof self._callback === 'function') {
                self._callback(
                  [
                    {
                      target: target,
                      contentRect: {
                        width: rect.width,
                        height: rect.height,
                        x: 0,
                        y: 0,
                        top: 0,
                        left: 0,
                        right: rect.width,
                        bottom: rect.height,
                      },
                    },
                  ],
                  self
                );
              }
            });
          };
          window.ResizeObserver.prototype.unobserve = function (target) {
            var idx = this._observed.indexOf(target);
            if (idx !== -1) this._observed.splice(idx, 1);
          };
          window.ResizeObserver.prototype.disconnect = function () {
            this._observed = [];
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
