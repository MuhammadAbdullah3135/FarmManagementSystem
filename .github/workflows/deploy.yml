name: Deploy to Heroku

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: heroku-deploy
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run backend tests
        run: dotnet test FarmManagementSystem.slnx --nologo

  test-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  deploy:
    needs: [test-backend, test-client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: npm install --global heroku

      - name: Build and release container to Heroku
        run: |
          set -euo pipefail
          export HEROKU_API_KEY="${{ secrets.HEROKU_API_KEY }}"
          heroku container:login
          heroku container:push web --app "${{ secrets.HEROKU_APP_NAME }}"
          heroku container:release web --app "${{ secrets.HEROKU_APP_NAME }}"
          echo "Deployed: https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com"
