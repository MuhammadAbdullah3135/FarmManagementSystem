name: Deploy to Heroku

on:
  push:
    branches: [main]
  # Pull requests are gated too. Before this trigger existed, a PR ran no CI at
  # all -- the only way to reach a test run was to push to main, i.e. straight
  # into the release path. The deploy job below is guarded so a PR can never
  # reach Heroku, no matter how green its tests are.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Re-run the post-deploy smoke check against the current release without pushing a new container'
        type: boolean
        default: false

concurrency:
  group: heroku-deploy
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    # A real PostgreSQL for the integration tests. Without it those tests SKIP (they are
    # written to skip when no server is reachable, so the suite stays usable on a laptop) and
    # this job went green while production answered 400 and 500 for ordinary requests: the
    # InMemory provider the rest of the suite uses evaluates LINQ client-side, so it cannot see
    # a query PostgreSQL refuses to translate or a naive DateTime it refuses to compare.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Read by DashboardPostgresIntegrationTests; it creates and drops its own database.
      FMS_TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run backend tests
        # Target the test project, not FarmManagementSystem.slnx: the solution also contains
        # src/FMS.Mobile (MAUI), which needs the maui-android workload on the runner and failed
        # this job with NETSDK1147, blocking the Heroku release that `deploy` waits on.
        run: dotnet test tests/FMS.Domain.Tests/FMS.Domain.Tests.csproj --nologo

      - name: Assert the PostgreSQL integration tests actually ran
        # The skip is deliberate on a machine without a database, and the danger here is the
        # opposite of a failure: skipping is silent. If this ever stops matching, the
        # provider-drift class of bug is invisible again.
        run: |
          dotnet test tests/FMS.Domain.Tests/FMS.Domain.Tests.csproj --nologo \
            --filter "FullyQualifiedName~DashboardPostgresIntegrationTests" \
            --logger "console;verbosity=normal" | tee postgres-run.log
          if grep -q "PostgreSQL integration tests skipped" postgres-run.log; then
            echo "::error::The PostgreSQL integration tests skipped even though FMS_TEST_POSTGRES is set."
            exit 1
          fi

  test-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  deploy:
    needs: [test-backend, test-client]
    # Only from main, and never from a pull request: a green PR must prove the
    # suite passes, not release the branch to production. This also makes a
    # manual dispatch on a scratch ref safe (`gh workflow run deploy.yml --ref …`),
    # which is how the gate itself was verified.
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && inputs.skip_deploy != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: npm install --global heroku

      - name: Build and release container to Heroku
        run: |
          set -euo pipefail
          export HEROKU_API_KEY="${{ secrets.HEROKU_API_KEY }}"
          heroku container:login
          # The commit goes in as a build arg so the running image can say what it is; the
          # smoke job below compares that against the commit it released. Without it a release
          # that never landed is indistinguishable from one that did.
          heroku container:push web --arg GIT_SHA="${{ github.sha }}" --app "${{ secrets.HEROKU_APP_NAME }}"
          heroku container:release web --app "${{ secrets.HEROKU_APP_NAME }}"
          echo "Deployed: https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com (${{ github.sha }})"

  smoke:
    # Verifies production, which is the one thing no test in this workflow can do: the
    # PostgreSQL integration tests run the same endpoints in-process, and they were green on
    # commits whose release never reached Heroku at all (a red test-backend skips `deploy`, so
    # the fix sat on GitHub while the old container answered).
    #
    # This can only attest to a release, not prevent one — Heroku has already swapped the
    # container by the time it runs. Failing loudly is the point: a broken production turns the
    # workflow red with the endpoint and traceId named, instead of waiting for someone to
    # notice by hand. Recovery is `heroku releases:rollback web`.
    #
    # `always()` because this also has to run when someone re-checks the current release on its
    # own (workflow_dispatch with skip_deploy), where `deploy` never ran.
    needs: [deploy]
    if: >-
      always()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && (needs.deploy.result == 'success' || inputs.skip_deploy == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: scripts/qa-smoke.mjs runs on plain Node with no dependencies, so this job
      # adds seconds rather than a second install of the client's node_modules.
      - name: Smoke the released API
        env:
          FMS_API: https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com/api
          # The commit this run released: the API has to report it back from /health.
          FMS_SMOKE_SHA: ${{ github.sha }}
          # Writes only ever touch this farm. The script refuses to write if the account's farm
          # does not match, so a changed QA account fails the job instead of poking real data.
          FMS_SMOKE_FARM: FarmTestingApk
        run: node scripts/qa-smoke.mjs
