name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['client/**']
  # The client half of the same gate: a PR holding a broken client test must
  # fail here rather than at the deploy job. See deploy.yml for the rationale.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Stamped into the bundle by client/vite.config.ts, so the build running on a device can be
          # identified from the UI instead of guessed at.
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Test
        run: npm test

      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    # Guarded like deploy.yml: lint/build/test run for pull requests, publishing
    # to Pages never does.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
